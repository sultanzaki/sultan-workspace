name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: sultan
          POSTGRES_PASSWORD: ci-only-not-for-deployment
          POSTGRES_DB: sultan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sultan -d sultan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Vercel's CommonJS loader cannot rely on Node's require(esm) interop.
      NODE_OPTIONS: --no-experimental-require-module
      TEST_DATABASE_URL: postgresql://sultan:ci-only-not-for-deployment@127.0.0.1:5432/sultan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
